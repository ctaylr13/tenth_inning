name: checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  api:
    name: api (ruff + pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      - name: ruff check
        run: ruff check .

      - name: ruff format --check
        run: ruff format --check .

      # redsox_25.duckdb is gitignored, so there is no database here.
      # tests/conftest.py builds a stand-in and points server.DB_PATH at it.
      - name: pytest
        run: pytest tests/ -q

  frontend:
    name: frontend (tsc + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - run: yarn install --frozen-lockfile

      # `build` is `tsc -b && vite build`, so this type-checks and proves the
      # bundle still compiles, Linaria extraction included.
      - name: build
        run: yarn build
