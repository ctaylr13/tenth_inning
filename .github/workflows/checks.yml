name: checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  api:
    name: api (ruff + pytest)
    runs-on: ubuntu-latest
    services:
      # watch_history lives here now -- tests need it running, same as local.
      # conftest.py forces DATABASE_URL to this name regardless of the env
      # below, so this has to be the same database that's migrated here.
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: tenth_inning
          POSTGRES_PASSWORD: tenth_inning
          POSTGRES_DB: tenth_inning_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U tenth_inning -d tenth_inning_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://tenth_inning:tenth_inning@127.0.0.1:5433/tenth_inning_test
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      - name: ruff check
        run: ruff check .

      - name: ruff format --check
        run: ruff format --check .

      - name: alembic upgrade head
        run: alembic upgrade head

      # redsox_25.duckdb is gitignored, so there is no database here.
      # tests/conftest.py builds a stand-in and points server.DB_PATH at it.
      # pytest.ini supplies pythonpath and testpaths.
      - name: pytest
        run: pytest -q

  frontend:
    name: frontend (tsc + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - run: yarn install --frozen-lockfile

      # `build` is `tsc -b && vite build`, so this type-checks and proves the
      # bundle still compiles, Linaria extraction included.
      - name: build
        run: yarn build
