syntax = "proto3";

package tenth_inning.artifacts.v1;

// A portable, immutable snapshot of one completed game.
message GameArtifact {
  uint32 schema_version = 1;
  GameMetadata metadata = 2;
  repeated PlateAppearance plate_appearances = 3;
}

message GameMetadata {
  uint64 game_pk = 1;
  string official_date = 2;
  string game_time_utc = 3;
  uint64 away_team_id = 4;
  uint64 home_team_id = 5;
  string away_team_name = 6;
  string home_team_name = 7;
  optional uint32 away_score = 8;
  optional uint32 home_score = 9;
  optional bool is_doubleheader = 10;
  optional uint32 game_number = 11;
}

enum HalfInning {
  HALF_INNING_UNSPECIFIED = 0;
  HALF_INNING_TOP = 1;
  HALF_INNING_BOTTOM = 2;
}

message PlateAppearance {
  uint32 pa_id = 1;
  uint64 batting_team_id = 2;
  HalfInning half_inning = 3;
  uint32 inning = 4;
  uint64 batter_id = 5;
  uint64 pitcher_id = 6;
  string event = 7;
  string event_type = 8;
  string description = 9;
  optional uint32 rbi = 10;
  optional uint32 away_score = 11;
  optional uint32 home_score = 12;
  optional bool is_out = 13;
  optional uint32 balls = 14;
  optional uint32 strikes = 15;
  optional uint32 outs = 16;
  repeated PitchEvent pitches = 17;
}

message PitchEvent {
  uint32 pitch_number = 1;
  string description = 2;
  string code = 3;
  optional bool is_in_play = 4;
  optional bool is_strike = 5;
  optional bool is_ball = 6;
  optional bool is_out = 7;
  string pitch_type_code = 8;
  string pitch_type_description = 9;
  optional uint32 balls = 10;
  optional uint32 strikes = 11;
  optional uint32 outs = 12;
  optional uint32 pre_balls = 13;
  optional uint32 pre_strikes = 14;
  optional uint32 pre_outs = 15;
  optional double start_speed = 16;
  optional double end_speed = 17;
  optional uint32 zone = 18;
  optional double plate_time = 19;
  optional double extension = 20;
  optional double plate_x = 21;
  optional double plate_z = 22;
  optional uint32 spin_rate = 23;
  optional double bat_speed = 24;
  optional bool is_sword_swing = 25;
  optional double launch_speed = 26;
  optional double launch_angle = 27;
  optional double total_distance = 28;
  string trajectory = 29;
  string hardness = 30;
  string hit_location = 31;
  optional double hit_coordinate_x = 32;
  optional double hit_coordinate_y = 33;
  optional double hit_probability = 34;
}
