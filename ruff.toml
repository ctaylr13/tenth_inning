# Lint and format config for the API surface.
#
#   ./myenv/bin/python -m ruff check .     # bugs: unused imports, undefined names
#   ./myenv/bin/python -m ruff format .    # layout
#
# The formatter owns layout, so E501 is off -- a long line is something the
# formatter either splits or deliberately leaves alone, not a lint error.
#
# Where a compact table or grouped argument list carries meaning, the source
# marks it `# fmt: off` / `# fmt: skip` rather than dropping the formatter.

line-length = 88
target-version = "py313"

# sox_2025/ is ~68 one-off data-ingest scripts, not part of the API. Formatting
# them all would bury every real diff. Opt them in deliberately, not by default.
extend-exclude = ["sox_2025"]

[lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes -- unused imports, undefined names
    "W",    # pycodestyle warnings
    "I",    # import sorting
    "B",    # bugbear
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "RUF",  # ruff's own rules
]
ignore = [
    "E501",   # line length -- the formatter's job, not a lint error
    "UP042",  # `class ErrorCode(str, Enum)` over StrEnum: the FastAPI idiom, and
              # switching changes what str(member) returns. Flip deliberately.
]
